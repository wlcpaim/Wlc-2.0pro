<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard — NexusSaaS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script>
        tailwind.config = { darkMode: 'class', theme: { extend: { colors: { slate: { 950: '#020617' } } } } }
    </script>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-950 text-slate-200 font-sans antialiased min-h-screen flex">
    <aside id="sidebar" class="fixed inset-y-0 left-0 z-50 w-64 bg-slate-900/80 backdrop-blur-xl border-r border-slate-800 flex flex-col transition-transform duration-300 md:translate-x-0 -translate-x-full">
        <div class="h-20 flex items-center px-6 border-b border-slate-800">
            <a href="index.html" class="text-xl font-bold text-white flex items-center gap-2">
                <i class="fa-solid fa-cube text-indigo-500"></i> Nexus<span class="text-indigo-500">SaaS</span>
            </a>
        </div>
        <nav class="flex-1 px-4 py-6 space-y-1">
            <a href="#" class="flex items-center gap-3 px-4 py-3 text-sm font-semibold text-white bg-indigo-600/10 border border-indigo-500/20 rounded-xl"><i class="fa-solid fa-chart-pie w-5 text-indigo-400"></i> Visão Geral</a>
            <a href="#" class="flex items-center gap-3 px-4 py-3 text-sm font-medium text-slate-400 hover:text-white hover:bg-slate-800/50 rounded-xl"><i class="fa-solid fa-users w-5"></i> Usuários</a>
        </nav>
    </aside>

    <div class="flex-1 flex flex-col md:pl-64">
        <main class="p-6 md:p-10 space-y-8">
            <div class="bg-slate-900/40 border border-slate-800 p-6 rounded-2xl backdrop-blur-sm">
                <div class="flex justify-between items-center mb-6">
                    <h2 class="text-lg font-bold text-white">Performance de ROI</h2>
                    <select class="bg-slate-950 border border-slate-800 rounded-lg px-3 py-1 text-sm text-slate-400">
                        <option>Últimos 6 meses</option>
                    </select>
                </div>
                <div class="h-80">
                    <canvas id="roiChart"></canvas>
                </div>
            </div>
        </main>
    </div>
    <script src="script.js"></script>
</body>
</html>
