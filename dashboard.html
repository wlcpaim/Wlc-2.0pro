<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard — NexusSaaS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-950 text-slate-200 font-sans antialiased min-h-screen flex">
    <aside id="sidebar" class="fixed inset-y-0 left-0 z-50 w-64 bg-slate-900/50 backdrop-blur-xl border-r border-slate-800 flex flex-col">
        <div class="h-20 flex items-center px-8 border-b border-slate-800/50">
            <a href="index.html" class="text-xl font-bold text-white flex items-center gap-2">
                <i class="fa-solid fa-cube text-indigo-500"></i> Nexus<span class="text-indigo-500">SaaS</span>
            </a>
        </div>
        <nav class="flex-1 px-4 py-6 space-y-8">
            <div>
                <p class="px-4 text-[10px] font-bold text-slate-500 uppercase tracking-wider mb-2">Plataforma</p>
                <a href="#" class="flex items-center gap-3 px-4 py-3 text-sm font-semibold text-white bg-indigo-600/10 border border-indigo-500/20 rounded-xl transition-all">
                    <i class="fa-solid fa-chart-line w-5 text-indigo-400"></i> Visão Geral
                </a>
                <a href="#" class="flex items-center gap-3 px-4 py-3 text-sm font-medium text-slate-400 hover:text-white hover:bg-slate-800/50 rounded-xl transition-all">
                    <i class="fa-solid fa-users w-5"></i> Equipe
                </a>
                <a href="#" class="flex items-center gap-3 px-4 py-3 text-sm font-medium text-slate-400 hover:text-white hover:bg-slate-800/50 rounded-xl transition-all">
                    <i class="fa-solid fa-folder-open w-5"></i> Projetos
                </a>
            </div>
            <div>
                <p class="px-4 text-[10px] font-bold text-slate-500 uppercase tracking-wider mb-2">Conta</p>
                <a href="#" class="flex items-center gap-3 px-4 py-3 text-sm font-medium text-slate-400 hover:text-white hover:bg-slate-800/50 rounded-xl transition-all">
                    <i class="fa-solid fa-credit-card w-5"></i> Assinatura
                </a>
                <a href="#" class="flex items-center gap-3 px-4 py-3 text-sm font-medium text-slate-400 hover:text-white hover:bg-slate-800/50 rounded-xl transition-all">
                    <i class="fa-solid fa-gear w-5"></i> Configurações
                </a>
            </div>
        </nav>
        <div class="p-4 border-t border-slate-800">
            <div class="flex items-center gap-3 p-3 bg-slate-950 rounded-xl border border-slate-800">
                <div class="w-8 h-8 rounded-full bg-indigo-600 flex items-center justify-center font-bold text-xs text-white">JS</div>
                <div class="flex-1">
                    <p class="text-xs font-bold text-white">João Silva</p>
                    <p class="text-[10px] text-emerald-500 flex items-center gap-1"><span class="w-1.5 h-1.5 rounded-full bg-emerald-500"></span> Online</p>
                </div>
            </div>
        </div>
    </aside>

    <div class="flex-1 flex flex-col md:pl-64">
        <header class="h-20 border-b border-slate-800 flex items-center px-10 justify-between">
            <h1 class="text-lg font-semibold text-white">Visão Geral</h1>
            <button class="flex items-center gap-2 px-4 py-2 bg-slate-900 border border-slate-800 rounded-lg text-sm text-slate-400 hover:text-white hover:border-slate-700 transition-all">
                <i class="fa-solid fa-arrow-down-from-bracket"></i> Exportar Relatório
            </button>
        </header>
        <main class="p-10 space-y-8">
            <div class="bg-slate-900/40 border border-slate-800 p-8 rounded-2xl backdrop-blur-sm">
                <div class="flex justify-between items-center mb-8">
                    <div>
                        <h2 class="text-lg font-bold text-white">Performance de ROI</h2>
                        <p class="text-slate-400 text-sm">Evolução trimestral de métricas</p>
                    </div>
                    <select class="bg-slate-950 border border-slate-800 rounded-lg px-4 py-2 text-sm text-slate-400 outline-none cursor-pointer focus:border-indigo-500 transition-colors">
                        <option>Últimos 6 meses</option>
                        <option>Último ano</option>
                    </select>
                </div>
                <div class="h-[400px] w-full">
                    <canvas id="roiChart"></canvas>
                </div>
            </div>
        </main>
    </div>
    <script src="script.js"></script>
</body>
</html>
