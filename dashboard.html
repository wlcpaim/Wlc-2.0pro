<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard — NexusSaaS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-950 text-slate-200 font-sans antialiased min-h-screen flex">
    <aside id="sidebar" class="fixed inset-y-0 left-0 z-50 w-64 bg-slate-900/50 backdrop-blur-xl border-r border-slate-800 flex flex-col">
        <div class="h-20 flex items-center px-8 border-b border-slate-800/50">
            <a href="index.html" class="text-xl font-bold text-white flex items-center gap-2">
                <i class="fa-solid fa-cube text-indigo-500"></i> Nexus<span class="text-indigo-500">SaaS</span>
            </a>
        </div>
        <nav id="nav-accordion" class="flex-1 px-4 py-6 space-y-8">
            <div class="menu-group">
                <p class="px-4 text-[10px] font-bold text-slate-500 uppercase tracking-wider mb-2">Plataforma</p>
                <div class="nav-item">
                    <button class="flex w-full items-center justify-between px-4 py-3 text-sm font-semibold text-white bg-indigo-600/10 border border-indigo-500/20 rounded-xl transition-all">
                        <span class="flex items-center gap-3"><i class="fa-solid fa-chart-line w-5 text-indigo-400"></i> Visão Geral</span>
                        <i class="fa-solid fa-chevron-down text-[10px]"></i>
                    </button>
                    <div class="sub-menu hidden px-4 py-2 space-y-1">
                        <a href="#" class="block px-4 py-2 text-xs text-slate-400 hover:text-white transition-colors">Analytics Real-time</a>
                        <a href="#" class="block px-4 py-2 text-xs text-slate-400 hover:text-white transition-colors">Métricas de ROI</a>
                    </div>
                </div>
            </div>
            <div class="menu-group">
                <p class="px-4 text-[10px] font-bold text-slate-500 uppercase tracking-wider mb-2">Operações</p>
                <div class="nav-item">
                    <button class="flex w-full items-center justify-between px-4 py-3 text-sm font-medium text-slate-400 hover:text-white hover:bg-slate-800/50 rounded-xl transition-all">
                        <span class="flex items-center gap-3"><i class="fa-solid fa-folder-open w-5"></i> Projetos</span>
                        <i class="fa-solid fa-chevron-right text-[10px]"></i>
                    </button>
                    <div class="sub-menu hidden px-4 py-2 space-y-1">
                        <a href="#" class="block px-4 py-2 text-xs text-slate-400 hover:text-white transition-colors">Projetos Ativos</a>
                        <a href="#" class="block px-4 py-2 text-xs text-slate-400 hover:text-white transition-colors">Cronogramas</a>
                    </div>
                </div>
            </div>
        </nav>
        <div class="p-4 border-t border-slate-800">
            <div class="flex items-center gap-3 p-3 bg-slate-950 rounded-xl border border-slate-800">
                <div class="w-8 h-8 rounded-full bg-indigo-600 flex items-center justify-center font-bold text-xs text-white">JS</div>
                <div class="flex-1">
                    <p class="text-xs font-bold text-white">João Silva</p>
                    <p class="text-[10px] text-emerald-500 flex items-center gap-1"><span class="w-1.5 h-1.5 rounded-full bg-emerald-500"></span> Online</p>
                </div>
            </div>
        </div>
    </aside>
    <div class="flex-1 flex flex-col md:pl-64">
        <header class="h-20 border-b border-slate-800 flex items-center px-10 justify-between">
            <h1 class="text-lg font-semibold text-white">Visão Geral</h1>
        </header>
        <main class="p-10">
            <div class="bg-slate-900/40 border border-slate-800 p-8 rounded-2xl backdrop-blur-sm">
                <div class="h-[400px] w-full">
                    <canvas id="roiChart"></canvas>
                </div>
            </div>
        </main>
    </div>
    <script src="script.js"></script>
</body>
</html>
